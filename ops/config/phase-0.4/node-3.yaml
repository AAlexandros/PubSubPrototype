node:
  name: node-3
  listenHost: 0.0.0.0
  listenPort: 7000
  identityPath: /data/identity
peers:
  - host: pubsub-node-1
    port: 7000
transport:
  pingIntervalMs: 5000
  pingTimeoutMs: 3000
  reconnectInitialMs: 1000
  reconnectMaxMs: 10000
registry:
  enabled: true
  runtimeDir: /registry
  signer: node-3
  pollIntervalMs: 1000
control:
  host: 0.0.0.0
  port: 8000
peerSampling:
  advertisedHost: pubsub-node-3
  viewSize: 2
  swapLength: 2
  cycleIntervalMs: 2000
  ageThreshold: 10
  randomSeed: 3
