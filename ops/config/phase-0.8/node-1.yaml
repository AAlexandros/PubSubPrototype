node:
  name: node-1
  listenHost: 0.0.0.0
  listenPort: 7000
  identityPath: /data/identity
peers: []
transport:
  pingIntervalMs: 5000
  pingTimeoutMs: 3000
  reconnectInitialMs: 1000
  reconnectMaxMs: 10000
registry:
  enabled: true
  runtimeDir: /registry
  signer: node-1
  pollIntervalMs: 1000
control: {host: 0.0.0.0, port: 8000}
peerSampling: {advertisedHost: pubsub-node-1, viewSize: 2, swapLength: 2, cycleIntervalMs: 2000, ageThreshold: 10, randomSeed: 1}
navigation: {capacity: 2, routingBase: 2, cycleIntervalMs: 2000, staleAfterMs: 20000}
dissemination: {randomLinkCount: 1, cycleIntervalMs: 2000, staleAfterMs: 20000, randomSeed: 101}
persistence:
  enabled: true
  membershipPath: /replication-registry/servers.json
  deliveryStatePath: /data/identity/recovery-state.json
  connectionTimeoutMs: 1000
  requestTimeoutMs: 3000
  retries: 1
  recoveryConcurrency: 8
